# Levanta todo el proyecto en local:  docker compose up --build
# Luego abre http://localhost:8080  (usuario: admin@bpg.local / contraseña: Admin12345)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bpg
      POSTGRES_USER: bpg
      POSTGRES_PASSWORD: bpg
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpg -d bpg"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://bpg:bpg@db:5432/bpg
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-cambiar-en-produccion}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bpg.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
      ADMIN_NOMBRE: Administrador
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
  uploads:
